<style>
/* Layout concept: dark engineering console. Collapsible rail, top bar with repo filter, one detail-driven workspace per module. */
:root{

@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#eef1f8; --surface:#ffffff; --surface2:#f3f5fb; --side:#f7f8fc; --line:#dbe1ef;
  --fg:#111827; --muted:#56627f; --accent:#2a62e0; --ai:#6a4cd6; --teal:#0b8f80; --green:#1a8f4d;
  --warn:#a56a00; --crit:#cc3434; --gray:#667087; color-scheme:light}}
:root[data-theme="light"]{
  --bg:#eef1f8; --surface:#ffffff; --surface2:#f3f5fb; --side:#f7f8fc; --line:#dbe1ef;
  --fg:#111827; --muted:#56627f; --accent:#2a62e0; --ai:#6a4cd6; --teal:#0b8f80; --green:#1a8f4d;
  --warn:#a56a00; --crit:#cc3434; --gray:#667087; color-scheme:light}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,h4,p{margin:0}
h1{font-size:22px;font-weight:600;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:15px;font-weight:600}
h3{font-size:13px;font-weight:600}
.mono{font-family:var(--mono);font-size:12px}
.muted{color:var(--muted)}
.small{font-size:12px}
svg.i{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:232px minmax(0,1fr);border:1px solid var(--line);border-radius:14px;background:var(--surface);min-height:calc(100vh - 28px);overflow:clip}
.app.col{grid-template-columns:60px minmax(0,1fr)}
.side{background:var(--side);border-right:1px solid var(--line);padding:14px 10px;display:flex;flex-direction:column;gap:3px;min-width:0}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 14px;font-weight:600;letter-spacing:-.01em}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,var(--accent),var(--ai));display:grid;place-items:center;flex:none}
.logo svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--muted);cursor:pointer;text-align:left;width:100%;white-space:nowrap}
.nav:hover{background:var(--surface2);color:var(--fg)}
.nav[aria-current="page"]{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--fg)}
.nav[aria-current="page"] svg{color:var(--accent)}
.col .nav span,.col .brand span,.col .navlabel{display:none}
.navlabel{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.spacer{flex:1}
.main{min-width:0;display:flex;flex-direction:column}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:12px;color:var(--fg);cursor:default;white-space:nowrap}
button.chip{cursor:pointer}
button.chip:hover{border-color:var(--accent)}
.top select,.filters select{background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-size:12px}
.search{flex:1 1 160px;min-width:120px;max-width:320px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px}
.avatar{width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--ai) 30%,var(--surface2));display:grid;place-items:center;font-size:11px;font-weight:600;flex:none}
.pop{position:relative}
.popbox{position:absolute;right:0;top:36px;width:min(320px,86vw);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:6px;z-index:20;box-shadow:0 12px 32px rgba(0,0,0,.35)}
.popbox button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px;border-radius:6px;cursor:pointer;font-size:12.5px}
.popbox button:hover{background:var(--surface)}
.sim{padding:7px 16px;font-size:12px;color:var(--muted);background:color-mix(in srgb,var(--warn) 9%,var(--surface));border-bottom:1px solid var(--line)}
.sim b{color:var(--warn);font-weight:600}
#view{padding:20px 16px 40px;display:flex;flex-direction:column;gap:18px;min-width:0}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}
.head p{color:var(--muted);margin-top:4px;max-width:62ch}
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface2);cursor:pointer;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ai{background:color-mix(in srgb,var(--ai) 20%,transparent);border-color:color-mix(in srgb,var(--ai) 50%,transparent)}
.btn.sm{padding:4px 9px;font-size:12px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.panel>h2,.panel>.ph{margin-bottom:10px}
.ph{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:16px;align-items:start}
.cols.even{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.kpis{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(168px,1fr))}

@media (max-width:860px){

  .nav{width:auto;flex:none}
  .col .nav span{display:inline}
}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:4px}
.kpi:hover{border-color:var(--accent)}
.kpi .v{font-size:28px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12px;color:var(--muted)}
.delta{font-size:11.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:.04em;text-transform:uppercase;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr[data-act]{cursor:pointer}
tbody tr[data-act]:hover td{background:color-mix(in srgb,var(--accent) 6%,transparent)}
tr.sel td{background:color-mix(in srgb,var(--accent) 12%,transparent)}
td.nw{white-space:nowrap}
.badge{--c:var(--gray);display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:500;white-space:nowrap;color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 32%,transparent)}
.b-gray{--c:var(--gray)}.b-warn{--c:var(--warn)}.b-teal{--c:var(--teal)}.b-green{--c:var(--green)}.b-crit{--c:var(--crit)}.b-ai{--c:var(--ai)}.b-accent{--c:var(--accent)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c);flex:none}
.pulse{animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 55%,transparent)}50%{box-shadow:0 0 0 5px transparent}}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;cursor:pointer;text-align:left;min-width:0}
.card:hover{border-color:var(--accent)}
.card.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.card .t{font-size:13px;line-height:1.4}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 12px;font-size:12px}
.kv dt{color:var(--muted)}.kv dd{margin:0;word-break:break-word}
.mini{display:flex;align-items:center;gap:8px}
.mono-av{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;font-size:12px;font-weight:600;background:color-mix(in srgb,var(--ai) 22%,var(--surface2));color:var(--ai);flex:none}
.tl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.tl li{display:grid;grid-template-columns:44px 14px minmax(0,1fr);gap:8px;padding:6px 0;font-size:12.5px}
.tl .tm{color:var(--muted);font-family:var(--mono);font-size:11.5px}
.tl .nd{width:9px;height:9px;border-radius:50%;background:var(--c);margin-top:5px}
.tl li:not(:last-child) .nd{box-shadow:0 14px 0 -3px var(--line)}
.alist{display:flex;flex-direction:column;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:9px 10px;border:1px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;text-align:left;width:100%;font-size:12.5px}
.alert:hover{border-color:var(--accent)}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.pill{padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface2);font-size:12px;cursor:pointer}
.pill[aria-pressed="true"]{background:color-mix(in srgb,var(--accent) 20%,transparent);border-color:var(--accent)}
.map{width:100%;height:auto;display:block}
.map text{fill:var(--fg);font:12px var(--font)}
.map .sub{fill:var(--muted);font-size:10.5px}
.map .nodebox{fill:var(--surface);stroke:var(--line);stroke-width:1.2}
.map g[data-act]{cursor:pointer}
.map g[data-act]:hover .nodebox{stroke:var(--accent)}
.map .selring{stroke:var(--accent);stroke-width:2}
.flow{stroke-dasharray:6 6;animation:flow 1.2s linear infinite;fill:none;stroke-width:2}
@keyframes flow{to{stroke-dashoffset:-12}}
.diff{font-family:var(--mono);font-size:12px;border:1px solid var(--line);border-radius:10px;overflow-x:auto;background:var(--surface)}
.diff div{display:grid;grid-template-columns:36px 36px minmax(max-content,1fr);white-space:pre}
.diff .n{color:var(--muted);text-align:right;padding:0 6px;user-select:none}
.diff .add{background:color-mix(in srgb,var(--green) 13%,transparent)}
.diff .del{background:color-mix(in srgb,var(--crit) 13%,transparent)}
.diff .hunk{color:var(--muted);background:var(--surface2)}
.diff .x{padding-right:12px}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{flex:1 1 70px;min-width:56px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:11.5px;color:var(--muted);cursor:pointer;text-align:left}

.life span{padding:3px 8px;border-radius:6px;font-size:11.5px;border:1px solid var(--line);color:var(--muted)}

.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--teal);width:0}

.enter{animation:enter .45s ease both}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.tree{list-style:none;margin:0;padding-left:18px;border-left:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.tree.root{border:0;padding:0}
.node{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;cursor:pointer;font-size:12.5px}
.node:hover{border-color:var(--accent)}
.node.sel{border-color:var(--ai);box-shadow:0 0 0 1px var(--ai)}
textarea,input[type=text]{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
label.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px}
.pre{font-family:var(--mono);font-size:12px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;justify-content:space-between;gap:8px;align-items:center}
.pre code{overflow-x:auto;white-space:pre;min-width:0}
.modal{position:fixed;inset:0;background:rgba(5,8,16,.62);display:grid;place-items:center;padding:16px;z-index:50}
.mbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(620px,100%);max-height:88vh;overflow:auto;display:flex;flex-direction:column;gap:12px;animation:enter .25s ease both}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:9px;font-size:13px;z-index:70;max-width:90vw}
.tour{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(360px,calc(100vw - 32px));background:var(--surface2);border:1px solid var(--ai);border-radius:14px;padding:14px;z-index:40;display:flex;flex-direction:column;gap:8px;box-shadow:0 14px 40px rgba(0,0,0,.45)}
.big{font-size:clamp(22px,4vw,32px);font-weight:600;letter-spacing:-.02em;line-height:1.15;text-wrap:balance}
.callout{padding:10px 12px;border-radius:10px;font-size:12.5px;background:color-mix(in srgb,var(--c,var(--accent)) 10%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--accent)) 30%,transparent)}
details{border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 10px}
summary{cursor:pointer;font-size:12.5px}
@media (prefers-reduced-motion:reduce){.pulse,.flow,.enter,.bar.run i,.mbox{animation:none}.bar.run i{width:100%}}
</style>

  if(m[0])c.status=m[0];(S.log[c.id]=S.log[c.id]||[]).push([nowT(),m[1]]);render();toast(m[1])},

 'cs-approve':e=>{const c=cs(e.dataset.id);if(c.ev!=='independent'){toast('Blocked: '+c.id+' has no independent validation of its current candidate.');return}c.stage=5;c.review='Accepted';render();toast(c.id+' accepted')},
 'cs-commit':e=>{const c=cs(e.dataset.id);c.stage=6;c.hash='c'+Math.random().toString(16).slice(2,8);render();toast(c.id+' committed as '+c.hash+' (simulated)')},
 'ctx-node':e=>{S.ctxNode=e.dataset.id;render()},
 'ctx-record':()=>{const n=DECISIONS.length+16;DECISIONS.push({id:'DR-0'+n,q:'How should PaymentService support more providers?',alts:'Replace, extend, provider interface',sel:'Provider interface (draft)',who:'Maya Rahman',ev:FINDINGS.filter(f=>S.pick[f.id]).map(f=>f.id).join(', '),date:'Nov 17',draft:true});S.pick={};render();toast('Added to the decision register')},
 'copy-rec':()=>copy($('#rec').value),
 'gen-sum':()=>{S.gen[S.techSel]=TECH[S.techSel].b;render()},
 'gen-brief':()=>{S.reqText=$('#reqIn').value;const t=S.reqText,vague=/holiday|soon|asap|quickly|before|later/i.test(t);S.briefOut=[['Business objective',t],['User problem','Customers cannot pay with a method they prefer at checkout.'],['Desired outcome','The requested payment option is available to customers.'],['Constraints','Needs the payment provider design (DR-018) to be agreed first.'],['Priority','To be set by the requester'],['Acceptance criteria','Customers can complete a purchase using the requested method. Refunds and receipts work.'],['Questions for engineering','What is the earliest safe release date given CF-101? Which markets are in scope?'],['Quality flags',vague?'The timing is vague. Add a date or range.':'No unclear terms detected.']];render()},
 'copy-exec':()=>copy($('#exec').value),
 'integ-config':e=>{const x=INTEGRATIONS[+e.dataset.i];modal(`<div class="ph"><h2>${x.n}</h2><button class="btn sm" data-act="modal-close">Close</button></div><p class="small muted">${x.d}</p>${B(x.s,INT_C[x.s])}<div class="alist">${x.caps.map(c=>`<label class="ck"><input type="checkbox" checked> ${c}</label>`).join('')}</div><div class="callout" style="--c:var(--warn)">No live connection can be made from this prototype. ${x.s==='Proposed touchpoint'?'This integration is a proposal and does not exist today.':''}</div><div class="row"><button class="btn primary" data-act="integ-toggle" data-i="${e.dataset.i}">${x.s==='Simulated connection'?'Disable simulation':'Enable simulated connection'}</button></div>`)},
 'integ-toggle':e=>{const x=INTEGRATIONS[+e.dataset.i];x.s=x.s==='Simulated connection'?'Not configured':'Simulated connection';x.sync=x.s==='Simulated connection'?'just now':'Never';closeModal();renderTop();render()},
 'wiz-open':()=>{W.step=0;modal(wizHtml())},
 'wiz-next':()=>{if(W.step===7){closeModal();toast('Walkthrough complete. Nothing was created.');return}W.step++;modal(wizHtml())},
 'wiz-back':()=>{W.step--;modal(wizHtml())},
 'modal-close':closeModal,
 copy:e=>copy(e.dataset.t),
 'demo-go':e=>{S.D.step=+e.dataset.i;render()},
 'demo-next':()=>{S.D.step=Math.min(DEMO.length-1,S.D.step+1);render()},
 'demo-prev':()=>{S.D.step=Math.max(0,S.D.step-1);render()},
 'demo-reset':()=>{S.D={step:0,recorded:false,verified:false,approved:false};render()},
 'demo-record':()=>{S.D.recorded=true;render();toast('Decision DR-018 recorded (simulated)')},
 'demo-verify':()=>{S.D.verifying=true;render();setTimeout(()=>{S.D.verifying=false;S.D.verified=true;if(S.view==='demo')render();toast('Verification passed (simulated)')},1900)},
 'demo-approve':()=>{S.D.approved=true;render();toast('Changeset accepted (simulated)')},
 'tour-start':()=>tourTo(0),
 'tour-next':()=>{if(S.tour===TOUR.length-1){S.tour=-1;renderTour();toast('Tour finished');return}tourTo(S.tour+1)},
 'tour-back':()=>tourTo(Math.max(0,S.tour-1)),
 'tour-end':()=>{S.tour=-1;renderTour()}
};
document.addEventListener('click',ev=>{
 if(!ev.target.closest('.pop'))$('#notif').hidden=true;
 if(ev.target.id==='modal'){closeModal();return}
 const e=ev.target.closest('[data-act]');if(!e||e.disabled)return;
 const f=ACT[e.dataset.act];if(f)f(e);
});
document.addEventListener('keydown',ev=>{
 if(ev.key==='Escape'&&!$('#modal').hidden)closeModal();
 if((ev.key==='Enter'||ev.key===' ')&&ev.target.matches('.card[data-act],.map g[data-act]')){ev.preventDefault();ev.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}
});
document.addEventListener('change',ev=>{
 const t=ev.target;
 if(t.id==='repoSel'){S.repo=t.value;render();return}
 if(t.dataset.f){S[t.dataset.f]=t.value;render();return}
 if(t.dataset.pick){S.pick[t.dataset.pick]=t.checked;const sc=window.scrollY;render();window.scrollTo({top:sc});return}
 if(t.dataset.tech!==undefined){S.techSel=+t.dataset.tech;render();return}
 if(t.id==='rev'){S.reviewed=t.checked;S.keepExec=$('#exec').value;render();return}
 if(t.dataset.w){W[t.dataset.w]=t.type==='checkbox'?t.checked:t.value}
});
document.addEventListener('input',ev=>{
 const t=ev.target;
 if(t.id==='q'){S.q=t.value;render();return}
 if(t.id==='reqIn')S.reqText=t.value;
 if(t.id==='exec')S.execText=t.value;
 if(t.id==='sumOut')S.gen[S.techSel]=t.value;
 if(t.dataset.w&&t.type==='text')W[t.dataset.w]=t.value;
});

renderTop();
const h0=location.hash.slice(1);if(V[h0])S.view=h0;
render();
</script>
